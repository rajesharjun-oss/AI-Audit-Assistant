name: Apply AI timeout fix

on:
  push:
    branches:
      - fix/ai-review-timeout
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[ai-timeout-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v4
        with:
          ref: fix/ai-review-timeout
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply targeted patch
        run: python scripts/apply_ai_timeout_fix_v4.py

      - name: Validate source changes
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python -m py_compile ai_policy_review.py ai_combined_review.py ai_review_pipeline.py app.py
            git diff --check
          } 2>&1 | tee validation.log

      - name: Upload validation diagnostics
        if: steps.validate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ai-timeout-validation-log
          path: validation.log

      - name: Stop after validation failure
        if: steps.validate.outcome == 'failure'
        run: exit 1

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run timeout regression tests
        run: |
          pytest -q tests/test_ai_timeout_regressions.py
          pytest -q tests/test_reviewer.py -k "ai_openai_call_uses_bounded_timeout or quick_ai_payload_uses_smaller_output_budget or ai_model_attempts_are_limited_for_automatic_quick_review or ai_invalid_provider_response_has_actionable_message or ai_dns_resolution_error_is_classified_and_explained"

      - name: Commit tested patch when needed
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "AI Audit Assistant Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add ai_policy_review.py ai_combined_review.py ai_review_pipeline.py app.py .env.example README.md tests/test_reviewer.py tests/test_ai_timeout_regressions.py
          git commit -m "Fix AI review timeout handling [ai-timeout-fix-applied]"
          git push origin HEAD:fix/ai-review-timeout
